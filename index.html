<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkinOne - No More Long Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #00FF00;
            font-family: 'Dela Gothic One', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        /* Главный заголовок */
        h1 {
            font-size: clamp(24px, 5vw, 48px);
            text-transform: uppercase;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        /* Подзаголовок */
        h2 {
            font-size: clamp(18px, 3vw, 24px);
            margin-bottom: 40px;
            color: #fff; /* Выделим белым для контраста */
            text-shadow: 0 0 10px #00FF00;
        }

        /* Кнопка REGISTER */
        .btn-register {
            display: inline-block;
            background: transparent;
            color: #00FF00;
            border: 4px solid #00FF00;
            padding: 20px 50px;
            font-size: 20px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .btn-register:hover {
            background: #00FF00;
            color: #000;
            box-shadow: 0 0 30px #00FF00;
            transform: scale(1.05);
        }

        /* Декор внизу */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>DONT LIKE LONG LINKS ON YOUR SOCIALS?</h1>
    <h2>THERE ARE WE LINKINONE</h2>

    <a href="https://me.lnkin1.v6.navy/register.html" class="btn-register">REGISTER</a>

    <footer>MADED BY LINKINONE</footer>

</body>
</html>
